<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML DOCUMENT</title>
  </head>
  <body>
    <h1>SIGNUP PAGE</h1>
    <form action="login.html" method="get" width="500px" height="500px">
        <label for="name">Enter Your Name</label>
        <input type="text" id="name" name="user_name" placeholder="Enter Your Name" minlength="3" required/><br><br>
        <label for="email">Enter Your Email</label>
        <input type="email" id="email" name="user_email" placeholder="Enter Your Email" required/><br><br>
        <label for="dob">Enter Your Date of Birth</label>
        <input type="date" id="dob" name="user_dob"/><br><br>
        <label for="age">Enter Your Age</label>
        <input type="number" id="age" name="user_age" min="18" max="60"><br><br>
        <label for="password">Enter Your Password</label>
        <input type="password" id="password" name="user_password" minlength="4" maxlength="8" required/><br><br>
        <h2>Gender</h2>
        <input type="radio" name="input" value="male"/>
        <label>Male</label>
        <input type="radio" name="input" value="female"/>
        <label>Female</label><br><br>
        <h2>Languages Known</h2>
        <input type="checkbox" name="language" value="Telugu" id="tel"/>
        <label for="tel">Telugu</label>
        <input type="checkbox" name="language" value="Hindi" id="hin"/>
        <label for="tel">Hindi</label>
        <input type="checkbox" name="language" value="English" id="eng"/>
        <label for="tel">English</label><br><br>
        <button type="submit">submit</button>
    </form>
  </body>
</html>
