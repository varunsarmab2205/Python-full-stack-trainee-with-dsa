<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML DOCUMENT</title>
  </head>
  <body>
    <h1>LOGIN PAGE</h1>
    <form action="main.html" method="get" width="500px" height="500px">
        <label for="name">Enter Your Name</label>
        <input type="text" id="name" placeholder="Enter Your Name" minlength="3" required/><br><br>
        <label for="email">Enter Your Email</label>
        <input type="email" id="email" placeholder="Enter Your Email" required/><br><br>
        <label for="password">Enter Your Password</label>
        <input type="password" id="password" minlength="4" maxlength="8" required/><br><br>
        <button type="submit">submit</button>
    </form>
  </body>
</html>
