<html>
<head>
    <title>Course Registration</title>
</head>
<body>

<h1>Course Registration Form</h1>

<!-- Anchor link to table -->
<a href="#coursedata">View Available Courses</a>

<br><br>

<form>

    Student Name:<br>
    <input type="text" name="name"><br><br>

    Email:<br>
    <input type="email" name="email"><br><br>

    Phone:<br>
    <input type="tel" name="phone"><br><br>

    Select Course:<br>
    <select name="course">
        <option>Python</option>
        <option>Java</option>
        <option>Web Development</option>
        <option>Data Science</option>
    </select><br><br>

    Mode:<br>
    <input type="radio" name="mode"> Online
    <input type="radio" name="mode"> Offline<br><br>

    Skills Known:<br>
    <input type="checkbox"> Python
    <input type="checkbox"> Java<br><br>

    Start Date:<br>
    <input type="date"><br><br>

    Upload Resume:<br>
    <input type="file"><br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Clear">

</form>

<hr>

<!-- Course Table -->
<h2 id="coursedata">Available Courses</h2>

<table border="2">
    <tr>
        <th>Course Name</th>
        <th>Duration</th>
        <th>Fee</th>
    </tr>

    <tr>
        <td>Python</td>
        <td>3 Months</td>
        <td>₹5000</td>
    </tr>

    <tr>
        <td>Java</td>
        <td>4 Months</td>
        <td>₹6000</td>
    </tr>


</table>

</body>
</html>
